[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-agent"
version = "0.0.1"
description = "An AI-editable Word layer: inspect, edit and re-render .docx documents losslessly"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Evert Koks" }]
keywords = ["docx", "word", "ooxml", "agent", "llm", "editing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: XML",
]
# ooxml-edit is the format-neutral editing core (the OPC package, ordered insertion, undo),
# extracted from pptx-agent; 0.2 brings its charts subpackage (charts, their workbooks and
# SmartArt), which docx-agent hosts in Word's drawings, and 0.2.2 Chart.workbook_values() and
# content_types_with(); 0.7.0 the shared describe, edit_chart's read action and Tool.reads,
# which docx_agent.tools builds on.  ooxml-common (standard library only, and docx2svg's
# own dependency) is named for what docx-agent imports from it directly: from 0.4.6 the
# package kinds (ooxml_common.kinds), from 0.8.0 the font folders (office.user_font_dirs,
# OOXML_FONT_DIRS); ooxml-edit 0.13.0 Toolbox(font_dirs=...) and DocumentFormat.configure,
# 0.14.0 Call.unlocked (render and check on a snapshot, the lock let go), 0.15.0 chart
# formatting and edit_chart's actions for it, 0.17.0 worker_task (a daemonic process's
# subprocess workers run the renderer and the layout).  ooxml-common 0.15.0:
# ooxml_common.locales (Locale, EN_US).  ooxml-edit 0.19.0: Toolbox(locale=...),
# Session.locale and call.locale, add_chart(..., locale=).  docx2svg:
# ConvertOptions(locale=...) (docx2svg on main since #8; its version is still 0.1).
# ooxml-edit 0.22.0: sources (O3) -- Tool.sources, call.source and Rows.provenance, which
# word_insert_markdown's and word_edit_table's ``from`` read a dataset or another
# document's table by; 0.23.0 DocumentFormat.source_hint (d:3 is a drawing, not a dataset);
# 0.25.0 source addresses in the saved file -- ooxml_edit.provenance, Call.keep_provenance
# and DocumentFormat.store_provenance/read_provenance, which docx_agent.edit.provenance
# keeps in a custom XML item.  0.26.0: batch applies its ops one by one (atomic: true for
# all or none), rolling a failed op back before the format's restored hook.  0.27.0:
# argument-name aliases (Tool.aliases, names_as) and refusals that say "did you mean".
# 0.30.0: describe lists the session's datasets, the document's describe too (tested here).
# 0.31.0: a run of a dataset's rows as a source (d:checks/#2:), and first_rows.  0.32.0:
# edit_chart's add with its look (data_labels, colors, style, part) and
# charts.actions.add_style_actions/apply_add_style, which the add handler runs.  0.33.0:
# text facts (Tool.facts), which the text tools' references are written by.
# docx2svg renders and lays out, and is a hard dependency by
# decision (ROADMAP.md, "Decisions", 9): it is standard-library only, so it costs little,
# and reflow feedback is part of every edit's answer.  Neither is on PyPI yet: install them
# first from sibling checkouts (`pip install -e ../ooxml-edit -e ../ooxml-common
# -e ../docx2svg`) or from GitHub.  markdown-it-py (with mdit-py-plugins for footnotes) is the
# Markdown parser, by decision (ROADMAP.md, "Decisions", 2): it reads to_markdown's output back
# for the reverse-parse check and checks a block's inline Markdown before it is written.
dependencies = ["lxml>=4.9", "ooxml-edit>=0.33.0", "ooxml-common>=0.15.0", "docx2svg>=0.1", "markdown-it-py>=3.0", "mdit-py-plugins>=0.4"]

[project.optional-dependencies]
# PNG output goes through docx2svg's rasteriser extra.
png = ["docx2svg[png]>=0.1"]
dev = ["pytest>=7", "pytest-xdist>=3"]

[project.urls]
Repository = "https://github.com/uvrt/docx-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The oracle drives the real Microsoft Word, one instance per machine; opt in with
# `pytest -m oracle` (ROADMAP.md, "Word is one instance per machine").
addopts = "-m 'not oracle'"
markers = [
  "oracle: drives Microsoft Word on macOS (one instance per machine); skips when Word is in use",
  "slow: an exhaustive sweep, run with --run-slow (ROADMAP.md, \"Testing strategy\")",
  "provider: calls a model provider's API online; skipped without its API key",
  "any_faces: holds without Office's faces, so tests/conftest.py does not skip it where one is absent",
]
