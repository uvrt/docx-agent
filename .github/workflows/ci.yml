name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so a sibling's change that breaks this repository shows the next morning
  # rather than at the next push here.  The seven repositories' crons are staggered,
  # libraries first: ooxml-common 02:07, ooxml-edit 02:17, pptx2svg 02:37, docx2svg 02:47,
  # pptx-agent 03:07, docx-agent 03:17, xlsx-agent 03:27 (UTC).  The whole matrix, as a
  # push runs it.
  schedule:
    - cron: "17 3 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one, so
          # it changes nothing for 3.10 to 3.14.
          allow-prereleases: true

      - name: Install
        # The siblings are not on PyPI yet, so they are installed from their repositories
        # first and `pip install -e .[dev]` then finds the requirements already satisfied.
        # They are @main, so a sibling change this repository depends on lands there first.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          python -m pip install "ooxml-edit @ git+https://github.com/uvrt/ooxml-edit@main"
          # TEMPORARY (r25): docx2svg 0.11.1 from its branch until its row keep rule and scan_fonts are merged; back to @main then
          python -m pip install "docx2svg[png] @ git+https://github.com/uvrt/docx2svg@keeps-r25"
          python -m pip install -e .[dev,png]

      # The open metric compatible substitutes, as docx2svg's CI installs them (its README,
      # "Fonts"): docx2svg then lays the Calibri, Arial, Times New Roman and Courier New
      # fixtures out where a runner has no Office, so the render, reflow and field tests
      # run rather than skip (tests/conftest.py skips only where a face is still absent:
      # Cambria, Georgia, Aptos).  Never a font file in the repository.  Windows has the
      # real faces, so nothing is added there.
      - name: Install the open substitute fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - name: Install the open substitute fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask font-carlito font-caladea font-liberation

      # A docstring's invalid escape ("\h") is a SyntaxWarning (3.12+; a DeprecationWarning
      # before), printed once at the first compile and easy to miss: fail on it here.
      - name: Compile with syntax warnings as errors
        run: python -W error::SyntaxWarning -W error::DeprecationWarning -m compileall -q -f src tests tools examples

      # The Word oracle tests are opt-in (`-m oracle`) and need macOS with Microsoft Word,
      # which no runner has; the provider tests need an API key, which CI does not hold;
      # the tests that read docx2svg's checkout (its probe observations and tools) skip
      # where it is not next to this one.  The default run, not --run-slow, as locally.
      - name: Test
        run: python -m pytest -q -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml's version, and __version__, must be the one CHANGELOG.md's top
      # version section names: the tag workflow tags that version when it reaches main.
      - name: The version agrees with CHANGELOG.md
        run: python tools/check_version.py
      # pyflakes and a few bug-finding rules ([tool.ruff] in pyproject.toml), at the dev
      # extra's pin.  Type checking is not on here yet: mypy still reports too much.
      - name: Lint (ruff)
        run: |
          python -m pip install "ruff==0.17.2"
          ruff check .
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
